<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabletop RPG Pro - Realtime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURAÇÃO DO FIREBASE (Já atualizada com seus dados)
        const firebaseConfig = {
            apiKey: "AIzaSyBVw6l8IfXlGTFKHHJLjsqAgyRwlxaVzvg",
            authDomain: "tabletop-teste.firebaseapp.com",
            projectId: "tabletop-teste",
            storageBucket: "tabletop-teste.firebasestorage.app",
            messagingSenderId: "562514175214",
            appId: "1:562514175214:web:8c3be376fb82b0609d7fff",
            measurementId: "G-DRVLNP7GBX"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "vtt-sessao-principal"; // ID único da sua mesa

        window.vtt = { db, auth, appId, collection, doc, setDoc, onSnapshot, updateDoc, deleteDoc, addDoc };
    </script>

    <style>
        :root { --bg-color: #020617; --accent: #4f46e5; }
        body { background-color: var(--bg-color); color: #f8fafc; overflow: hidden; height: 100vh; font-family: 'Inter', sans-serif; }
        
        /* Visibilidade por Cargo */
        .role-jogador .mestre-only { display: none !important; }
        
        /* Container do Mapa */
        #viewport { position: relative; width: 100vw; height: 100vh; cursor: grab; overflow: hidden; }
        #viewport:active { cursor: grabbing; }
        #map-container { position: absolute; transform-origin: 0 0; will-change: transform; }
        #active-map { display: block; pointer-events: none; }
        
        /* Grid Overlay */
        #grid-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 5; opacity: 0.2;
            background-image: linear-gradient(to right, #6366f1 1px, transparent 1px), 
                              linear-gradient(to bottom, #6366f1 1px, transparent 1px);
        }

        /* Tokens */
        .token { 
            position: absolute; border-radius: 50%; border: 2px solid white; 
            z-index: 20; background-size: cover; background-position: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.5); cursor: move;
            transition: transform 0.1s ease;
        }
        .token:hover { transform: scale(1.1); border-color: var(--accent); }

        /* Névoa de Guerra */
        #fog-canvas { position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none; opacity: 0.8; }
        body.role-mestre #fog-canvas { opacity: 0.4; }

        /* Sidebar UI */
        .sidebar { 
            position: fixed; left: 20px; top: 20px; bottom: 20px; width: 260px;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
            z-index: 100; display: flex; flex-col; padding: 20px;
        }
    </style>
</head>
<body class="role-jogador">

    <!-- Modal de Seleção de Cargo -->
    <div id="setup-modal" class="fixed inset-0 bg-black/80 z-[200] flex items-center justify-center p-4">
        <div class="bg-slate-900 p-8 rounded-2xl max-w-sm w-full border border-slate-700 text-center">
            <h2 class="text-2xl font-bold mb-6">Como deseja entrar?</h2>
            <div class="grid gap-4">
                <button onclick="initApp('mestre')" class="bg-indigo-600 hover:bg-indigo-500 p-4 rounded-xl font-bold transition">Mestre da Mesa</button>
                <button onclick="initApp('jogador')" class="bg-slate-700 hover:bg-slate-600 p-4 rounded-xl font-bold transition">Jogador</button>
            </div>
            <p id="auth-status" class="mt-4 text-xs text-slate-500 font-mono">Verificando conexão...</p>
        </div>
    </div>

    <!-- Interface Lateral -->
    <div class="sidebar shadow-2xl">
        <div class="mb-6 flex items-center justify-between">
            <h1 class="font-black italic text-indigo-400">REALTIME VTT</h1>
            <div id="sync-indicator" class="w-2 h-2 rounded-full bg-red-500"></div>
        </div>

        <div class="space-y-4 overflow-y-auto pr-2">
            <div class="mestre-only space-y-3">
                <p class="text-[10px] font-bold text-slate-500 uppercase">Controles do Mestre</p>
                <button onclick="document.getElementById('map-upload').click()" class="w-full bg-slate-800 text-xs p-2 rounded border border-slate-700 hover:bg-slate-700">Trocar Mapa</button>
                <button onclick="document.getElementById('token-upload').click()" class="w-full bg-indigo-600 text-xs p-2 rounded font-bold hover:bg-indigo-500">Adicionar Token</button>
                
                <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700">
                    <label class="text-[10px] text-slate-400">Tamanho do Grid: <span id="grid-val">60</span>px</label>
                    <input type="range" id="grid-slider" min="30" max="150" value="60" class="w-full mt-1">
                </div>

                <div class="flex gap-2">
                    <button onclick="toggleFogMode()" id="fog-btn" class="flex-1 bg-slate-800 text-[10px] p-2 rounded border border-slate-700">Revelar Névoa</button>
                    <button onclick="resetFog()" class="bg-red-900/30 text-red-400 text-[10px] p-2 rounded border border-red-900/50">Reset</button>
                </div>
            </div>

            <div class="space-y-2">
                <p class="text-[10px] font-bold text-slate-500 uppercase">Ações Rápidas</p>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="rollDice(20)" class="bg-slate-800 p-2 rounded text-xs border border-slate-700">d20</button>
                    <button onclick="rollDice(6)" class="bg-slate-800 p-2 rounded text-xs border border-slate-700">d6</button>
                </div>
            </div>

            <div id="dice-log" class="text-[10px] font-mono text-indigo-300 space-y-1 max-h-40 overflow-y-auto"></div>
        </div>

        <input type="file" id="map-upload" class="hidden" accept="image/*">
        <input type="file" id="token-upload" class="hidden" accept="image/*">
    </div>

    <!-- Viewport do Jogo -->
    <main id="viewport">
        <div id="map-container">
            <img id="active-map" src="" alt="">
            <div id="grid-overlay"></div>
            <canvas id="fog-canvas"></canvas>
            <div id="tokens-layer"></div>
        </div>
    </main>

    <script type="module">
        const State = {
            role: 'jogador',
            zoom: 1,
            pan: { x: 0, y: 0 },
            gridSize: 60,
            isFogActive: false,
            tokens: {}
        };

        const viewport = document.getElementById('viewport');
        const container = document.getElementById('map-container');
        const fogCanvas = document.getElementById('fog-canvas');
        const fogCtx = fogCanvas.getContext('2d');

        // --- INICIALIZAÇÃO ---
        window.initApp = async (role) => {
            const { auth, db, appId } = window.vtt;
            State.role = role;
            document.body.className = `role-${role}`;
            document.getElementById('setup-modal').style.display = 'none';

            // Autenticação Anônima
            try {
                await window.vtt.auth.signInAnonymously(auth);
                document.getElementById('sync-indicator').classList.replace('bg-red-500', 'bg-green-500');
                startRealtimeSync();
            } catch (e) {
                alert("Erro ao conectar ao Firebase. Verifique as chaves e as regras.");
            }
        };

        // --- SINCRONIZAÇÃO FIREBASE ---
        function startRealtimeSync() {
            const { db, appId, onSnapshot, doc, collection } = window.vtt;

            // Sync do Mundo (Mapa e Grid)
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'world'), (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    State.gridSize = data.grid || 60;
                    if (data.mapUrl && document.getElementById('active-map').src !== data.mapUrl) {
                        const img = document.getElementById('active-map');
                        img.src = data.mapUrl;
                        img.onload = () => resizeFog();
                    }
                    updateVisuals();
                }
            });

            // Sync de Tokens
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'tokens'), (snap) => {
                snap.docChanges().forEach(change => {
                    const id = change.doc.id;
                    const data = change.doc.data();
                    if (change.type === "added" || change.type === "modified") {
                        updateTokenDOM(id, data);
                    } else if (change.type === "removed") {
                        document.getElementById(`token-${id}`)?.remove();
                    }
                });
            });

            // Sync de Névoa
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'fog'), (snap) => {
                if (snap.exists() && State.role === 'jogador') {
                    const img = new Image();
                    img.onload = () => {
                        fogCtx.clearRect(0,0, fogCanvas.width, fogCanvas.height);
                        fogCtx.drawImage(img, 0, 0);
                    };
                    img.src = snap.data().imageData;
                }
            });
        }

        // --- FUNÇÕES DE INTERAÇÃO ---
        function updateVisuals() {
            container.style.transform = `translate(${State.pan.x}px, ${State.pan.y}px) scale(${State.zoom})`;
            document.getElementById('grid-overlay').style.backgroundSize = `${State.gridSize}px ${State.gridSize}px`;
            document.getElementById('grid-val').innerText = State.gridSize;
        }

        function updateTokenDOM(id, data) {
            let el = document.getElementById(`token-${id}`);
            if (!el) {
                el = document.createElement('div');
                el.id = `token-${id}`;
                el.className = 'token';
                el.style.backgroundImage = `url(${data.url})`;
                setupTokenDrag(el, id);
                document.getElementById('tokens-layer').appendChild(el);
            }
            el.style.width = el.style.height = `${State.gridSize * 0.9}px`;
            el.style.left = `${data.x}px`;
            el.style.top = `${data.y}px`;
        }

        function setupTokenDrag(el, id) {
            el.onmousedown = (e) => {
                if (e.button !== 0 || State.isFogActive) return;
                e.stopPropagation();
                const startX = e.clientX, startY = e.clientY;
                const initialX = el.offsetLeft, initialY = el.offsetTop;

                const move = (ev) => {
                    const dx = (ev.clientX - startX) / State.zoom;
                    const dy = (ev.clientY - startY) / State.zoom;
                    el.style.left = (initialX + dx) + "px";
                    el.style.top = (initialY + dy) + "px";
                };

                const up = async () => {
                    window.removeEventListener('mousemove', move);
                    window.removeEventListener('mouseup', up);
                    
                    // Snap to Grid
                    const snapX = Math.round(el.offsetLeft / State.gridSize) * State.gridSize + (State.gridSize * 0.05);
                    const snapY = Math.round(el.offsetTop / State.gridSize) * State.gridSize + (State.gridSize * 0.05);
                    
                    await window.vtt.updateDoc(window.vtt.doc(window.vtt.db, 'artifacts', window.vtt.appId, 'public', 'data', 'tokens', id), {
                        x: snapX, y: snapY
                    });
                };
                window.addEventListener('mousemove', move);
                window.addEventListener('mouseup', up);
            };
        }

        // --- CONTROLES DO MESTRE ---
        document.getElementById('map-upload').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                window.vtt.setDoc(window.vtt.doc(window.vtt.db, 'artifacts', window.vtt.appId, 'public', 'data', 'world'), {
                    mapUrl: ev.target.result,
                    grid: State.gridSize
                });
            };
            reader.readAsDataURL(file);
        };

        document.getElementById('token-upload').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                window.vtt.addDoc(window.vtt.collection(window.vtt.db, 'artifacts', window.vtt.appId, 'public', 'data', 'tokens'), {
                    url: ev.target.result,
                    x: 100, y: 100
                });
            };
            reader.readAsDataURL(file);
        };

        document.getElementById('grid-slider').oninput = (e) => {
            const val = parseInt(e.target.value);
            window.vtt.updateDoc(window.vtt.doc(window.vtt.db, 'artifacts', window.vtt.appId, 'public', 'data', 'world'), {
                grid: val
            });
        };

        // --- SISTEMA DE NÉVOA ---
        function resizeFog() {
            const img = document.getElementById('active-map');
            fogCanvas.width = img.width;
            fogCanvas.height = img.height;
            fogCtx.fillStyle = 'black';
            fogCtx.fillRect(0,0, fogCanvas.width, fogCanvas.height);
        }

        window.toggleFogMode = () => {
            State.isFogActive = !State.isFogActive;
            const btn = document.getElementById('fog-btn');
            btn.className = State.isFogActive ? "flex-1 bg-indigo-600 text-[10px] p-2 rounded border border-indigo-400" : "flex-1 bg-slate-800 text-[10px] p-2 rounded border border-slate-700";
            viewport.style.cursor = State.isFogActive ? 'crosshair' : 'grab';
        };

        viewport.onmousedown = (e) => {
            if (State.isFogActive && State.role === 'mestre') {
                const rect = container.getBoundingClientRect();
                const draw = (ev) => {
                    const x = (ev.clientX - rect.left) / State.zoom;
                    const y = (ev.clientY - rect.top) / State.zoom;
                    fogCtx.globalCompositeOperation = 'destination-out';
                    fogCtx.beginPath();
                    fogCtx.arc(x, y, State.gridSize, 0, Math.PI * 2);
                    fogCtx.fill();
                };
                window.addEventListener('mousemove', draw);
                window.addEventListener('mouseup', () => {
                    window.removeEventListener('mousemove', draw);
                    // Salva estado da névoa
                    const data = fogCanvas.toDataURL("image/webp", 0.3);
                    window.vtt.setDoc(window.vtt.doc(window.vtt.db, 'artifacts', window.vtt.appId, 'public', 'data', 'fog'), { imageData: data });
                }, { once: true });
                draw(e);
            } else if (e.button === 1 || e.button === 2) { // Pan
                let startP = { x: e.clientX - State.pan.x, y: e.clientY - State.pan.y };
                const movePan = (ev) => {
                    State.pan.x = ev.clientX - startP.x;
                    State.pan.y = ev.clientY - startP.y;
                    updateVisuals();
                };
                window.addEventListener('mousemove', movePan);
                window.addEventListener('mouseup', () => window.removeEventListener('mousemove', movePan), { once: true });
            }
        };

        viewport.onwheel = (e) => {
            e.preventDefault();
            State.zoom = Math.min(Math.max(State.zoom + (e.deltaY > 0 ? -0.1 : 0.1), 0.1), 4);
            updateVisuals();
        };

        window.rollDice = (sides) => {
            const res = Math.floor(Math.random() * sides) + 1;
            const log = document.getElementById('dice-log');
            const item = document.createElement('div');
            item.innerText = `> d${sides}: ${res}`;
            log.prepend(item);
        };

        viewport.oncontextmenu = (e) => e.preventDefault();
        updateVisuals();
    </script>
</body>
</html>
