<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabletop RPG Pro - Realtime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURAÇÃO OFICIAL DO USUÁRIO
        const firebaseConfig = {
            apiKey: "AIzaSyBVw6l8IfXlGTFKHHJLjsqAgyRwlxaVzvg",
            authDomain: "tabletop-teste.firebaseapp.com",
            projectId: "tabletop-teste",
            storageBucket: "tabletop-teste.firebasestorage.app",
            messagingSenderId: "562514175214",
            appId: "1:562514175214:web:8c3be376fb82b0609d7fff",
            measurementId: "G-DRVLNP7GBX"
        };

        // Inicialização Global
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Identificador da sessão (AppId para o Firestore)
        const vttAppId = "vtt-sessao-principal"; 

        // Exportando para o sistema usar
        window.vtt = { 
            db, auth, vttAppId, 
            doc, setDoc, onSnapshot, collection, updateDoc, addDoc,
            signInAnonymously
        };

        console.log("Firebase configurado com as chaves do usuário.");
    </script>

    <style>
        :root { --bg-color: #020617; --accent: #4f46e5; }
        body { background-color: var(--bg-color); color: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        
        #viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; cursor: grab; background: #000; }
        #viewport:active { cursor: grabbing; }
        
        #map-container { position: absolute; transform-origin: 0 0; will-change: transform; }
        #active-map { display: block; pointer-events: none; max-width: none; }
        
        #grid-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 5; opacity: 0.15;
            background-image: linear-gradient(to right, #6366f1 1px, transparent 1px), 
                              linear-gradient(to bottom, #6366f1 1px, transparent 1px);
        }

        .token { 
            position: absolute; border-radius: 50%; border: 2px solid white; 
            z-index: 20; background-size: cover; background-position: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.7); cursor: move;
            transition: width 0.2s, height 0.2s;
        }

        .sidebar { 
            position: fixed; left: 20px; top: 20px; bottom: 20px; width: 240px;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            z-index: 100; display: flex; flex-direction: column; padding: 15px;
        }

        .mestre-controls { display: none; }
        body.is-mestre .mestre-controls { display: block; }
    </style>
</head>
<body>

    <!-- Modal de Entrada -->
    <div id="setup-modal" class="fixed inset-0 bg-black/90 z-[200] flex items-center justify-center p-4 text-center">
        <div class="bg-slate-900 border border-slate-700 p-8 rounded-2xl max-w-sm w-full">
            <h1 class="text-2xl font-bold mb-2">Tabletop Realtime</h1>
            <p class="text-slate-400 text-sm mb-8">Conecte-se à sua mesa de RPG</p>
            <div class="grid gap-3">
                <button onclick="startVTT('mestre')" class="bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition">Entrar como Mestre</button>
                <button onclick="startVTT('jogador')" class="bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-bold transition">Entrar como Jogador</button>
            </div>
            <p id="auth-log" class="mt-6 text-[10px] font-mono text-slate-500 italic">Aguardando comando...</p>
        </div>
    </div>

    <div class="sidebar">
        <div class="flex items-center justify-between mb-6">
            <span class="text-xs font-black tracking-tighter text-indigo-400 uppercase">VTT Online</span>
            <div id="sync-dot" class="w-2 h-2 rounded-full bg-red-500"></div>
        </div>

        <div class="space-y-4 overflow-y-auto">
            <div class="mestre-controls space-y-3">
                <p class="text-[10px] text-slate-500 font-bold uppercase">Painel do Mestre</p>
                <button onclick="document.getElementById('f-map').click()" class="w-full bg-slate-800 text-[11px] p-2 rounded border border-slate-700">Subir Mapa</button>
                <button onclick="document.getElementById('f-token').click()" class="w-full bg-indigo-600 text-[11px] p-2 rounded font-bold">Add Token</button>
                <div class="p-2 bg-black/20 rounded border border-slate-800">
                    <label class="text-[9px] text-slate-400">Grid: <span id="grid-txt">60</span>px</label>
                    <input type="range" id="grid-range" min="40" max="120" value="60" class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <div class="space-y-2">
                <p class="text-[10px] text-slate-500 font-bold uppercase">Dados</p>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="roll(20)" class="bg-slate-800 py-2 rounded text-xs">d20</button>
                    <button onclick="roll(6)" class="bg-slate-800 py-2 rounded text-xs">d6</button>
                </div>
                <div id="dice-history" class="text-[10px] font-mono text-indigo-300 max-h-32 overflow-y-auto space-y-1"></div>
            </div>
        </div>

        <input type="file" id="f-map" class="hidden" accept="image/*">
        <input type="file" id="f-token" class="hidden" accept="image/*">
    </div>

    <div id="viewport">
        <div id="map-container">
            <img id="active-map" src="">
            <div id="grid-overlay"></div>
            <div id="tokens-layer"></div>
        </div>
    </div>

    <script type="module">
        const state = {
            role: 'jogador',
            zoom: 1,
            pan: { x: 0, y: 0 },
            gridSize: 60
        };

        const viewport = document.getElementById('viewport');
        const container = document.getElementById('map-container');
        const mapImg = document.getElementById('active-map');
        const statusLog = document.getElementById('auth-log');

        window.startVTT = async (role) => {
            const { auth, db, vttAppId, signInAnonymously } = window.vtt;
            state.role = role;
            if(role === 'mestre') document.body.classList.add('is-mestre');

            statusLog.innerText = "Autenticando no Firebase...";
            
            try {
                await signInAnonymously(auth);
                statusLog.innerText = "Conectado! Sincronizando dados...";
                
                document.getElementById('setup-modal').style.display = 'none';
                document.getElementById('sync-dot').classList.replace('bg-red-500', 'bg-green-500');
                
                initSync();
            } catch (err) {
                console.error(err);
                statusLog.innerHTML = `<span class="text-red-500">Erro: ${err.code}</span><br>Verifique se o login anônimo está ativo no console.`;
            }
        };

        function initSync() {
            const { db, vttAppId, onSnapshot, doc, collection } = window.vtt;

            // Sync Mapa e Grid
            onSnapshot(doc(db, 'artifacts', vttAppId, 'public', 'data', 'world'), (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    state.gridSize = data.grid || 60;
                    if (data.mapUrl && mapImg.src !== data.mapUrl) mapImg.src = data.mapUrl;
                    render();
                }
            });

            // Sync Tokens
            onSnapshot(collection(db, 'artifacts', vttAppId, 'public', 'data', 'tokens'), (snap) => {
                snap.docChanges().forEach(change => {
                    const id = change.doc.id;
                    const data = change.doc.data();
                    if (change.type === "removed") {
                        document.getElementById(id)?.remove();
                    } else {
                        updateTokenDOM(id, data);
                    }
                });
            });
        }

        function updateTokenDOM(id, data) {
            let el = document.getElementById(id);
            if (!el) {
                el = document.createElement('div');
                el.id = id;
                el.className = 'token';
                el.style.backgroundImage = `url(${data.url})`;
                attachDrag(el, id);
                document.getElementById('tokens-layer').appendChild(el);
            }
            el.style.width = el.style.height = `${state.gridSize * 0.9}px`;
            el.style.left = `${data.x}px`;
            el.style.top = `${data.y}px`;
        }

        function attachDrag(el, id) {
            el.onmousedown = (e) => {
                e.stopPropagation();
                const startX = e.clientX, startY = e.clientY;
                const initialX = el.offsetLeft, initialY = el.offsetTop;

                const move = (ev) => {
                    el.style.left = (initialX + (ev.clientX - startX) / state.zoom) + "px";
                    el.style.top = (initialY + (ev.clientY - startY) / state.zoom) + "px";
                };

                const stop = async () => {
                    window.removeEventListener('mousemove', move);
                    window.removeEventListener('mouseup', stop);
                    
                    const snapX = Math.round(el.offsetLeft / state.gridSize) * state.gridSize + (state.gridSize * 0.05);
                    const snapY = Math.round(el.offsetTop / state.gridSize) * state.gridSize + (state.gridSize * 0.05);
                    
                    const { db, vttAppId, updateDoc, doc } = window.vtt;
                    await updateDoc(doc(db, 'artifacts', vttAppId, 'public', 'data', 'tokens', id), { x: snapX, y: snapY });
                };
                window.addEventListener('mousemove', move);
                window.addEventListener('mouseup', stop);
            };
        }

        function render() {
            container.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;
            document.getElementById('grid-overlay').style.backgroundSize = `${state.gridSize}px ${state.gridSize}px`;
            document.getElementById('grid-txt').innerText = state.gridSize;
        }

        // Uploads (Mestre)
        document.getElementById('f-map').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const { db, vttAppId, setDoc, doc } = window.vtt;
                setDoc(doc(db, 'artifacts', vttAppId, 'public', 'data', 'world'), { mapUrl: ev.target.result, grid: state.gridSize });
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        document.getElementById('f-token').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const { db, vttAppId, addDoc, collection } = window.vtt;
                addDoc(collection(db, 'artifacts', vttAppId, 'public', 'data', 'tokens'), { url: ev.target.result, x: 50, y: 50 });
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        document.getElementById('grid-range').oninput = (e) => {
            const val = parseInt(e.target.value);
            const { db, vttAppId, updateDoc, doc } = window.vtt;
            updateDoc(doc(db, 'artifacts', vttAppId, 'public', 'data', 'world'), { grid: val });
        };

        // Navegação
        viewport.onmousedown = (e) => {
            if(e.button !== 0) return;
            const startX = e.clientX - state.pan.x, startY = e.clientY - state.pan.y;
            const move = (ev) => {
                state.pan.x = ev.clientX - startX;
                state.pan.y = ev.clientY - startY;
                render();
            };
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', () => window.removeEventListener('mousemove', move), {once:true});
        };

        viewport.onwheel = (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            state.zoom = Math.min(Math.max(state.zoom + delta, 0.1), 3);
            render();
        };

        window.roll = (s) => {
            const r = Math.floor(Math.random() * s) + 1;
            const log = document.getElementById('dice-history');
            const div = document.createElement('div');
            div.innerText = `> d${s}: ${r}`;
            log.prepend(div);
        };

        render();
    </script>
</body>
</html>
